<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Grade Switch</title>
</head>
<body>
    <div id="outputBox"></div>

    <script>
       
        let score = Math.floor(Math.random() * 101); 
        let grade = "";
        let result = "";

        if (score >= 80) grade = "A";
        else if (score >= 70) grade = "B";
        else if (score >= 60) grade = "C";
        else if (score >= 50) grade = "D";
        else grade = "F";

        result = (score >= 50) ? "ผลสอบ: ผ่าน" : "ผลสอบ: ไม่ผ่าน";

        let description = "";
        switch (grade) {
            case "A": description = "ยอดเยี่ยมมาก"; break;
            case "B": description = "ดีมาก รักษามาตรฐานไว้"; break;
            case "C": description = "ผ่านเกณฑ์ระดับดี"; break;
            case "D": description = "พอใช้ แต่ควรพัฒนาเพิ่ม"; break;
            case "F": description = "ต้องลงทะเบียนเรียนใหม่"; break;
            default: description = "เกรดไม่ถูกต้อง";
        }

        let outputText = `คะแนนที่สุ่มได้: ${score} <br> เกรด: ${grade} <br> ${result} <br> คำอธิบาย: ${description}`;
        document.getElementById("outputBox").innerHTML = outputText;
        console.log(outputText.replace(/<br>/g, "\n"));
    </script>
</body>
</html>
