<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab CSS1 - Card Layout</title>
    <style>
        /* Basic Setup */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* 1. Use Flexbox for 3 cards in one row */
        .container {
            display: flex;
            gap: 20px; /* Space between cards */
            padding: 40px;
            background-color: #eeeeee;
            border-radius: 8px;
        }

        /* 2. Card Design */
        .card {
            background-color: #ffffff; /* Light background */
            padding: 20px;
            width: 200px;
            border-radius: 10px; /* Rounded corners */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Box shadow */
            transition: transform 0.3s ease; /* Smooth transition for hover */
            cursor: pointer;
        }

        .card h3 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #333;
        }

        .card p {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.4;
        }

        /* 3. Hover Effect (Scale up slightly) */
        .card:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h3>Card 1</h3>
            <p>คำอธิบายเนื้อหาของการ์ดใบแรก</p>
        </div>

        <div class="card">
            <h3>Card 2</h3>
            <p>คำอธิบายเนื้อหาของการ์ดใบที่สอง</p>
        </div>

        <div class="card">
            <h3>Card 3</h3>
            <p>คำอธิบายเนื้อหาของการ์ดใบที่สาม</p>
        </div>
    </div>

</body>
</html>
